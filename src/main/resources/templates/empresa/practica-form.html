<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Publicar práctica · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/company.css}">
</head>
<body>
<div class="company-layout">

  <div th:replace="~{fragments/empresa-sidebar :: sidebar(activePage='crear', empresaId=${practica.empresa != null ? practica.empresa.id : null})}"></div>

  <div class="company-content">
    <div class="p-7">

      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900" th:text="${practica.id == null} ? 'Publicar nueva práctica' : 'Editar práctica'">Publicar nueva práctica</h1>
        <p class="text-slate-500 text-sm mt-1">Completa todos los campos para publicar</p>
      </div>

      <!--
        NOTA: el hidden "empresa.id" asume que Spring puede resolver
        el id a la entidad Empresa al enviar el formulario. Si al
        guardar sale un error de conversión, pídele a tu compañera
        que agregue un Converter<String,Empresa> o que reciba
        empresaId como @RequestParam aparte en vez de anidado.
      -->
      <form th:action="@{/empresa/practicas/guardar}" th:object="${practica}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{empresa.id}">

        <div class="grid grid-cols-3 gap-6">
          <div class="col-span-2 space-y-4">

            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
              <h2 class="font-semibold text-slate-900 font-display">Información básica</h2>
              <div>
                <label class="text-xs font-medium text-slate-700 mb-1 block">Nombre de la práctica *</label>
                <input th:field="*{titulo}" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="text-xs font-medium text-slate-700 mb-1 block">Descripción *</label>
                <textarea th:field="*{descripcion}" rows="4" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
              </div>
              <div>
                <label class="text-xs font-medium text-slate-700 mb-1 block">Requisitos *</label>
                <textarea th:field="*{requisitos}" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
              <h2 class="font-semibold text-slate-900 font-display mb-4">Detalles operativos</h2>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-xs font-medium text-slate-700 mb-1 block">Área *</label>
                  <input th:field="*{area}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: Ciberseguridad">
                </div>
                <div>
                  <label class="text-xs font-medium text-slate-700 mb-1 block">Modalidad *</label>
                  <select th:field="*{modalidad}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Presencial">Presencial</option>
                    <option value="Híbrida">Híbrida</option>
                    <option value="Remota">Remota</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs font-medium text-slate-700 mb-1 block">Duración *</label>
                  <select th:field="*{duracion}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="6 meses">6 meses</option>
                    <option value="12 meses">12 meses</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs font-medium text-slate-700 mb-1 block">Vacantes *</label>
                  <input type="number" min="1" th:field="*{vacantes}" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="col-span-2">
                  <label class="text-xs font-medium text-slate-700 mb-1 block">Ciudad / Ubicación *</label>
                  <input th:field="*{ciudadUbicacion}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
              </div>
            </div>

            <button type="submit" class="bg-blue-700 text-white font-semibold text-sm px-6 py-2.5 rounded-lg hover:bg-blue-800">
              Guardar práctica
            </button>
          </div>

          <div class="space-y-4">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
              <p class="text-sm font-semibold text-blue-900 mb-2">📋 Antes de publicar</p>
              <ul class="text-xs text-blue-800 space-y-1.5">
                <li>• Verifica que la descripción sea clara</li>
                <li>• La práctica será visible para todos los estudiantes</li>
                <li>• Puedes editarla después de publicada</li>
              </ul>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
