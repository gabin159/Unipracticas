<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Evaluar estudiante · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/company.css}">
</head>
<body>
<div class="company-layout">

  <div th:replace="~{fragments/empresa-sidebar :: sidebar(activePage='practicas', empresaId=${empresaId})}"></div>

  <div class="company-content">
    <div class="p-7" style="max-width:640px">

      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Evaluar estudiante</h1>
        <p class="text-slate-500 text-sm mt-1">Calificación general y comentarios para el tutor</p>
      </div>

      <form th:action="@{/empresa/evaluaciones/guardar}" method="post" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
        <input type="hidden" name="estudianteId" th:value="${estudianteId}">
        <input type="hidden" name="empresaId" th:value="${empresaId}">
        <input type="hidden" name="practicaId" th:value="${practicaId}">

        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Tutor universitario *</label>
          <select name="tutorId" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nombreCompleto}">Tutor</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Calificación (0.0 – 5.0) *</label>
          <input type="number" name="calificacion" step="0.1" min="0" max="5" required
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Comentarios</label>
          <textarea name="comentarios" rows="4"
                    class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                    placeholder="Desempeño general del estudiante..."></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-700 text-white font-bold text-sm py-2.5 rounded-xl hover:bg-blue-800">
          Enviar evaluación al tutor
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
