<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Postulantes · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/company.css}">
</head>
<body>
<div class="company-layout">

  <!--
    OJO: el controller de postulaciones() NO manda "empresaId" al
    modelo, así que lo saco del primer postulante de la lista (frágil
    si la lista viene vacía). Pídele a tu compañera que agregue
    model.addAttribute("empresaId", practica.getEmpresa().getId())
    en ese método para que esto sea confiable siempre.
  -->
  <div th:replace="~{fragments/empresa-sidebar :: sidebar(activePage='practicas', empresaId=${empresaId})}"></div>

  <div class="company-content">
    <div class="p-7">

      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Postulantes</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(postulaciones)} + ' postulaciones'">0 postulaciones</p>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Estudiante</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Programa</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Sem.</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Fecha</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Estado</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${postulaciones}" class="border-b border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-3">
                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0"
                       th:text="${#strings.substring(p.estudiante.nombreCompleto,0,1)}">M</div>
                  <span class="text-xs font-medium text-slate-900" th:text="${p.estudiante.nombreCompleto}">Nombre</span>
                </div>
              </td>
              <td class="px-4 py-3 text-xs text-slate-600" th:text="${p.estudiante.programaAcademico}">Programa</td>
              <td class="px-4 py-3 text-xs text-slate-600" th:text="${p.estudiante.semestre}">9</td>
              <td class="px-4 py-3 text-xs text-slate-400" th:text="${p.fechaPostulacion}">Fecha</td>
              <td class="px-4 py-3">
                <span class="text-xs font-medium px-2 py-0.5 rounded-full border"
                      th:classappend="${p.estado == 'ACEPTADA'} ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (${p.estado == 'RECHAZADA'} ? 'bg-red-50 text-red-700 border-red-200' : 'bg-amber-50 text-amber-700 border-amber-200')"
                      th:text="${p.estado}">Pendiente</span>
              </td>
              <td class="px-4 py-3">
                <div th:if="${p.estado == 'PENDIENTE'}" class="flex gap-1.5">
                  <form th:action="@{/empresa/postulaciones/aceptar/{id}(id=${p.id})}" method="post">
                    <button type="submit" class="px-2.5 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700">✓ Sí</button>
                  </form>
                  <form th:action="@{/empresa/postulaciones/rechazar/{id}(id=${p.id})}" method="post">
                    <button type="submit" class="px-2.5 py-1 bg-red-500 text-white text-xs font-bold rounded-lg hover:bg-red-600">✗ No</button>
                  </form>
                </div>
                <a th:if="${p.estado == 'ACEPTADA'}"
                   th:href="@{/empresa/evaluaciones/nueva(estudianteId=${p.estudiante.id},empresaId=${p.practica.empresa.id},practicaId=${p.practica.id})}"
                   class="text-xs text-violet-700 hover:underline">Evaluar</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(postulaciones)}">
              <td colspan="6" class="text-center text-sm text-slate-400 py-8">Todavía no hay postulantes para esta práctica.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
