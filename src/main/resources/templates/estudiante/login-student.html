<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>UniPrácticas · Estudiantes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-8">

<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <div class="w-12 h-12 rounded-xl bg-blue-700 flex items-center justify-center mx-auto mb-3">
      <span class="text-white font-bold text-lg">UP</span>
    </div>
    <h1 class="text-2xl font-bold font-display text-slate-900">UniPrácticas</h1>
    <p class="text-slate-500 text-sm">Universidad Santo Tomás Tunja</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">

    <!--
      Pestañas Iniciar sesión / Crear cuenta.
      th:classappend deja abierta por defecto la que indique el controller
      (por ejemplo, si viene de un link "Regístrate" ya abre en "register").
      El cambio de pestaña sin recargar la página lo hace student.js.
    -->
    <div class="flex rounded-xl border border-slate-200 p-1 mb-6">
      <button type="button" id="tabLogin"
              th:classappend="${modo} == 'register' ? '' : 'is-active'"
              class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-lg transition-colors text-slate-500 hover:text-slate-700">
        Iniciar sesión
      </button>
      <button type="button" id="tabRegister"
              th:classappend="${modo} == 'register' ? 'is-active' : ''"
              class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-lg transition-colors text-slate-500 hover:text-slate-700">
        Crear cuenta
      </button>
    </div>

    <!-- ============== FORMULARIO DE LOGIN ============== -->
    <form id="formLogin" th:action="@{/student/login}" method="post"
          th:classappend="${modo} == 'register' ? 'hidden' : ''" class="space-y-4">

      <div>
        <label for="correoLogin" class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional</label>
        <input id="correoLogin" name="correo" type="email" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="nombre.apellido@usantoto.edu.co">
      </div>
      <div>
        <label for="passwordLogin" class="text-xs font-medium text-slate-700 mb-1 block">Contraseña</label>
        <input id="passwordLogin" name="password" type="password" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="••••••••">
      </div>

      <p th:if="${param.error}" class="text-red-600 text-xs text-center">Correo o contraseña incorrectos.</p>

      <button type="submit" class="w-full mt-1 bg-blue-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-blue-800 transition-colors">
        Iniciar sesión
      </button>
      <p class="text-center text-xs text-slate-500">
        ¿No tienes cuenta? <span id="irARegistro" class="text-blue-700 font-medium cursor-pointer hover:underline">Regístrate gratis</span>
      </p>
    </form>

    <!-- ============== FORMULARIO DE REGISTRO ============== -->
    <form id="formRegister" th:action="@{/student/register}" method="post"
          th:classappend="${modo} == 'register' ? '' : 'hidden'" class="space-y-3">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="nombres" class="text-xs font-medium text-slate-700 mb-1 block">Nombres *</label>
          <input id="nombres" name="nombres" required
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Mariana">
        </div>
        <div>
          <label for="apellidos" class="text-xs font-medium text-slate-700 mb-1 block">Apellidos *</label>
          <input id="apellidos" name="apellidos" required
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="López García">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="programa" class="text-xs font-medium text-slate-700 mb-1 block">Programa *</label>
          <select id="programa" name="programa" required
                  class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option>Ing. de Sistemas</option>
            <option>Ing. Industrial</option>
            <option>Contaduría</option>
            <option>Ing. Civil</option>
          </select>
        </div>
        <div>
          <label for="semestre" class="text-xs font-medium text-slate-700 mb-1 block">Semestre *</label>
          <select id="semestre" name="semestre" required
                  class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option th:each="s : ${#numbers.sequence(6,10)}" th:text="${s} + '°'" th:value="${s}">6°</option>
          </select>
        </div>
      </div>

      <div>
        <label for="correoRegistro" class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional *</label>
        <input id="correoRegistro" name="correo" type="email" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="nombre.apellido@usantoto.edu.co">
      </div>

      <div>
        <label for="passwordRegistro" class="text-xs font-medium text-slate-700 mb-1 block">Contraseña *</label>
        <input id="passwordRegistro" name="password" type="password" required minlength="8"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Mínimo 8 caracteres">
      </div>
      <div>
        <label for="passwordConfirmacion" class="text-xs font-medium text-slate-700 mb-1 block">Confirmar contraseña *</label>
        <input id="passwordConfirmacion" name="passwordConfirmacion" type="password" required minlength="8"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Repite tu contraseña">
      </div>

      <p id="errorConfirmacion" class="hidden text-red-600 text-xs text-center">Las contraseñas no coinciden.</p>

      <button type="submit" class="w-full mt-1 bg-blue-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-blue-800 transition-colors">
        Crear cuenta
      </button>
      <p class="text-center text-xs text-slate-500">
        ¿Ya tienes cuenta? <span id="irALogin" class="text-blue-700 font-medium cursor-pointer hover:underline">Inicia sesión</span>
      </p>
    </form>

  </div>
</div>

<script th:src="@{/js/student.js}"></script>
</body>
</html>
