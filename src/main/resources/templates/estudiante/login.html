<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-8">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="w-12 h-12 rounded-xl bg-blue-700 flex items-center justify-center mx-auto mb-3">
      <span class="text-white font-bold text-lg">UP</span>
    </div>
    <h1 class="text-2xl font-bold font-display text-slate-900">UniPrácticas</h1>
    <p class="text-slate-500 text-sm">Universidad Santo Tomás Tunja</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
    <h2 class="text-lg font-bold font-display text-slate-900 mb-4">Iniciar sesión</h2>

    <form th:action="@{/estudiante/login}" method="post" class="space-y-4">
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional</label>
        <input name="correo" type="email" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="nombre.apellido@usantoto.edu.co">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Contraseña</label>
        <input name="password" type="password" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
      </div>

      <p th:if="${error}" class="text-red-600 text-xs text-center" th:text="${error}">Error</p>

      <button type="submit" class="w-full mt-1 bg-blue-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-blue-800 transition-colors">
        Iniciar sesión
      </button>

      <p class="text-center text-xs text-slate-500">
        ¿No tienes cuenta? <a th:href="@{/estudiante/registro}" class="text-blue-700 font-medium hover:underline">Regístrate</a>
      </p>
    </form>
  </div>
</div>
</body>
</html>
