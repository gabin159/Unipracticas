<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Buscar prácticas · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body>
<div class="student-layout">

  <!--
    OJO: GET /estudiante/practicas no recibe estudianteId en el
    controller (solo "buscar"). Lo leo del query param que yo mismo
    agrego en los links (?estudianteId=...). Si entras a esta página
    sin ese parámetro (ej. desde un link viejo), el botón "Postularme"
    no va a saber de quién es la postulación. Lo ideal a futuro es que
    el controller también reciba y reenvíe estudianteId al modelo.
  -->
  <div th:with="estudianteIdParam=${param.estudianteId}">
    <div th:replace="~{fragments/estudiante-sidebar :: sidebar(activePage='practicas', estudianteId=${estudianteIdParam})}"></div>
  </div>

  <div class="student-content">
    <div class="p-7">

      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Buscar prácticas</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(practicas)} + ' prácticas encontradas'">0 prácticas</p>
      </div>

      <form th:action="@{/estudiante/practicas}" method="get" class="bg-white rounded-xl border border-slate-200 p-4 mb-5 flex gap-3">
        <input type="hidden" name="estudianteId" th:value="${param.estudianteId}">
        <input name="buscar" th:value="${buscar}" placeholder="Buscar por título, empresa o área..."
               class="flex-1 text-sm border border-slate-200 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="text-sm font-semibold text-white bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-800">Buscar</button>
      </form>

      <div class="grid grid-cols-2 gap-4">
        <div th:each="p : ${practicas}" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div class="flex items-start gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center flex-shrink-0">
              <span class="text-white text-xs font-bold" th:text="${#strings.substring(p.empresa.nombreEmpresa,0,2)}">EM</span>
            </div>
            <div>
              <h3 class="font-semibold text-slate-900 text-sm leading-snug" th:text="${p.titulo}">Título</h3>
              <p class="text-slate-500 text-xs" th:text="${p.empresa.nombreEmpresa}">Empresa</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5 mb-3">
            <span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-blue-50 text-blue-700 border-blue-200" th:text="${p.area}">Área</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-slate-100 text-slate-600 border-slate-200" th:text="${p.modalidad}">Modalidad</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full border bg-slate-100 text-slate-600 border-slate-200" th:text="${p.duracion}">Duración</span>
          </div>
          <p class="text-xs text-slate-500 mb-3">📍 <span th:text="${p.ciudadUbicacion}">Ciudad</span> · <span th:text="${p.vacantes}">2</span> vacantes</p>

          <form th:if="${param.estudianteId != null}" th:action="@{/estudiante/postular}" method="post" class="flex justify-end">
            <input type="hidden" name="estudianteId" th:value="${param.estudianteId}">
            <input type="hidden" name="practicaId" th:value="${p.id}">
            <button type="submit" class="text-xs font-semibold text-white bg-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-800">Postularme</button>
          </form>
        </div>

        <p th:if="${#lists.isEmpty(practicas)}" class="col-span-2 text-center text-sm text-slate-400 py-10">No hay prácticas que coincidan con tu búsqueda.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
