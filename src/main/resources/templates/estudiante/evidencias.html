<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis evidencias · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body>
<div class="student-layout">

  <div th:replace="~{fragments/estudiante-sidebar :: sidebar(activePage='evidencias', estudianteId=${estudianteId})}"></div>

  <div class="student-content">
    <div class="p-7">
      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Mis evidencias</h1>
        <p class="text-slate-500 text-sm mt-1">Fotos y actividades de tu práctica</p>
      </div>

      <form th:action="@{/estudiante/evidencias/subir}" method="post" enctype="multipart/form-data"
            class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm mb-5 space-y-3">
        <input type="hidden" name="estudianteId" th:value="${estudianteId}">
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Título</label>
          <input name="titulo" required placeholder="Ej: Reunión semanal con el equipo" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Descripción</label>
          <textarea name="descripcion" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none resize-none"></textarea>
        </div>
        <div class="flex gap-3 items-end">
          <div class="flex-1">
            <label class="text-xs font-medium text-slate-700 mb-1 block">Foto</label>
            <input type="file" name="archivo" required accept="image/*" class="w-full text-sm">
          </div>
          <button type="submit" class="text-sm font-semibold text-white bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-800">Publicar</button>
        </div>
      </form>

      <div class="grid grid-cols-3 gap-3">
        <div th:each="e : ${evidencias}" class="rounded-xl border border-slate-200 overflow-hidden bg-white">
          <div class="h-28 bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center"><span class="text-4xl">📷</span></div>
          <div class="p-2">
            <p class="text-xs font-medium text-slate-700 leading-tight" th:text="${e.titulo}">Título</p>
            <p class="text-xs text-slate-400" th:text="${e.fechaSubida}">Fecha</p>
          </div>
        </div>
        <p th:if="${#lists.isEmpty(evidencias)}" class="col-span-3 text-center text-sm text-slate-400 py-10">Aún no has subido evidencias.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
