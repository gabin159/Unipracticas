<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis documentos · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body>
<div class="student-layout">

  <div th:replace="~{fragments/estudiante-sidebar :: sidebar(activePage='documentos', estudianteId=${estudianteId})}"></div>

  <div class="student-content">
    <div class="p-7" style="max-width:720px">
      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Mis documentos</h1>
        <p class="text-slate-500 text-sm mt-1">Hoja de vida, formatos e informes</p>
      </div>

      <!-- Subir documento -->
      <form th:action="@{/estudiante/documentos/subir}" method="post" enctype="multipart/form-data"
            class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm mb-4 flex gap-3 items-end">
        <input type="hidden" name="estudianteId" th:value="${estudianteId}">
        <div class="flex-1">
          <label class="text-xs font-medium text-slate-700 mb-1 block">Tipo de documento</label>
          <select name="tipoDocumento" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
            <option value="HOJA_DE_VIDA">Hoja de vida</option>
            <option value="FORMATO_VINCULACION">Formato de vinculación</option>
            <option value="INFORME">Informe</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="text-xs font-medium text-slate-700 mb-1 block">Archivo</label>
          <input type="file" name="archivo" required class="w-full text-sm">
        </div>
        <button type="submit" class="text-sm font-semibold text-white bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-800">Subir</button>
      </form>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-100">
        <div th:each="d : ${documentos}" class="flex items-center gap-3 px-5 py-4">
          <span class="text-xl">📄</span>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-900" th:text="${d.nombreArchivo}">archivo.pdf</p>
            <p class="text-xs text-slate-500" th:text="${d.tipoDocumento} + ' · ' + ${d.fechaSubida}">Tipo · Fecha</p>
          </div>
        </div>
        <p th:if="${#lists.isEmpty(documentos)}" class="text-center text-sm text-slate-400 py-8">Aún no has subido documentos.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
