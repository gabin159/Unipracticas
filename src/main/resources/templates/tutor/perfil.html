<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mi panel · Tutor · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body>
<div class="tutor-layout">

  <div th:replace="~{fragments/tutor-sidebar :: sidebar(activePage='perfil', tutorId=${tutor.id})}"></div>

  <div class="tutor-content">
    <div class="p-7">

      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900" th:text="'Bienvenido, ' + ${tutor.nombreCompleto} + ' 👋'">Bienvenido</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${tutor.departamento}">Departamento</p>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <a th:href="@{/tutor/estudiantes/{id}(id=${tutor.id})}" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:border-violet-300">
          <p class="text-xs text-slate-500 mb-1">Estudiantes asignados</p>
          <p class="text-2xl font-bold font-display text-emerald-600" th:text="${#lists.size(tutor.estudiantes)}">0</p>
        </a>
        <a th:href="@{/tutor/evaluaciones/{id}(id=${tutor.id})}" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:border-violet-300">
          <p class="text-xs text-slate-500 mb-1">Evaluaciones recibidas</p>
          <p class="text-2xl font-bold font-display text-violet-600" th:text="${#lists.size(tutor.evaluaciones)}">0</p>
        </a>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-2 space-y-4">

          <!-- Estudiantes asignados (vista rápida) -->
          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
            <h2 class="font-semibold text-slate-900 font-display mb-4">Estudiantes asignados</h2>
            <div class="space-y-2">
              <div th:each="e : ${tutor.estudiantes}" class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold flex-shrink-0"
                     th:text="${#strings.substring(e.nombreCompleto,0,1)}">M</div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-slate-900" th:text="${e.nombreCompleto}">Nombre</p>
                  <p class="text-xs text-slate-500" th:text="${e.practica != null ? e.practica.titulo : 'Sin práctica asignada'}">Práctica</p>
                </div>
              </div>
              <p th:if="${#lists.isEmpty(tutor.estudiantes)}" class="text-sm text-slate-400 text-center py-6">Aún no tienes estudiantes asignados.</p>
            </div>
          </div>

          <!-- Datos institucionales -->
          <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
            <h2 class="font-semibold text-slate-900 font-display mb-4">Mis datos</h2>
            <div class="grid grid-cols-2 gap-x-8 gap-y-4">
              <div><p class="text-xs text-slate-500 mb-0.5">Correo</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.correo}">-</p></div>
              <div><p class="text-xs text-slate-500 mb-0.5">Teléfono</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.telefono}">-</p></div>
              <div><p class="text-xs text-slate-500 mb-0.5">Cargo</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.cargo}">-</p></div>
              <div><p class="text-xs text-slate-500 mb-0.5">Departamento</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.departamento}">-</p></div>
              <div><p class="text-xs text-slate-500 mb-0.5">Facultad</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.facultad}">-</p></div>
              <div><p class="text-xs text-slate-500 mb-0.5">Formación máxima</p><p class="text-sm font-medium text-slate-900" th:text="${tutor.formacionMaxima}">-</p></div>
            </div>
            <!-- OJO: TutorController no tiene endpoint de edición de perfil todavía -->
          </div>
        </div>

        <div class="space-y-4">
          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm text-center">
            <div class="w-16 h-16 rounded-full bg-violet-600 flex items-center justify-center text-white text-xl font-bold mx-auto mb-3"
                 th:text="${#strings.substring(tutor.nombreCompleto,0,1)}">J</div>
            <p class="font-bold text-slate-900" th:text="${tutor.nombreCompleto}">Tutor</p>
            <p class="text-xs text-slate-500" th:text="${tutor.cargo}">Cargo</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
