<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta de tutor · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 to-slate-100 flex items-center justify-center p-8">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="w-12 h-12 rounded-xl bg-violet-700 flex items-center justify-center mx-auto mb-3">
      <span class="text-white font-bold text-lg">UP</span>
    </div>
    <h1 class="text-2xl font-bold font-display text-slate-900">UniPrácticas</h1>
    <p class="text-slate-500 text-sm">Portal de Tutores · UST</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
    <h2 class="text-lg font-bold font-display text-slate-900 mb-4">Crear cuenta de tutor</h2>

    <form th:action="@{/tutor/registro}" th:object="${tutor}" method="post" class="space-y-3">
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Nombre completo *</label>
        <input th:field="*{nombreCompleto}" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500" placeholder="Javier Hernández Ruiz">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Cargo</label>
        <input th:field="*{cargo}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500" placeholder="Docente titular">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Facultad</label>
          <input th:field="*{facultad}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Departamento</label>
          <input th:field="*{departamento}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
      </div>
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Formación máxima</label>
        <input th:field="*{formacionMaxima}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500" placeholder="Maestría en Ing. de Sistemas">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Ciudad</label>
          <input th:field="*{ciudad}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-700 mb-1 block">Teléfono</label>
          <input th:field="*{telefono}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
      </div>
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional *</label>
        <input type="email" th:field="*{correo}" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500" placeholder="profe.nombre@usantoto.edu.co">
      </div>
      
      <!-- Campo Contraseña con Ojo -->
      <div>
        <label class="text-xs font-medium text-slate-700 mb-1 block">Contraseña *</label>
        <div class="relative">
          <input type="password" id="passTutor" th:field="*{contrasena}" required minlength="8" class="w-full border border-slate-200 rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
          <button type="button" onclick="togglePassword('passTutor', 'iconTutor')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm p-1">
            <span id="iconTutor">👁️</span>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full mt-1 bg-violet-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-violet-800 transition-colors">
        Crear cuenta
      </button>
      <p class="text-center text-xs text-slate-500">
        ¿Ya tienes cuenta? <a th:href="@{/tutor/login}" class="text-violet-700 font-medium hover:underline">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>

<script>
  function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = '🙈';
    } else {
      input.type = 'password';
      icon.textContent = '👁️';
    }
  }
</script>
</body>
</html>
