<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Evaluaciones · Tutor · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body>
<div class="tutor-layout">

  <div th:replace="~{fragments/tutor-sidebar :: sidebar(activePage='evaluaciones', tutorId=${tutorId})}"></div>

  <div class="tutor-content">
    <div class="p-7">
      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Evaluaciones recibidas</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(evaluaciones)} + ' evaluaciones'">0</p>
      </div>

      <div class="space-y-3">
        <div th:each="ev : ${evaluaciones}" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div class="flex items-start justify-between">
            <div>
              <p class="font-semibold text-slate-900" th:text="${ev.estudiante.nombreCompleto}">Estudiante</p>
              <p class="text-slate-500 text-xs" th:text="${ev.empresa.nombreEmpresa} + ' · ' + ${ev.practica.titulo}">Empresa · Práctica</p>
              <p class="text-slate-400 text-xs mt-1" th:text="${ev.fecha}">Fecha</p>
            </div>
            <div class="text-right">
              <p class="text-2xl font-bold font-display"
                 th:classappend="${ev.calificacion != null and ev.calificacion >= 4.0} ? 'text-emerald-600' : 'text-amber-600'"
                 th:text="${ev.calificacion} + ' / 5.0'">4.5 / 5.0</p>
            </div>
          </div>
          <p th:if="${ev.comentarios != null and !ev.comentarios.isEmpty()}"
             class="text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded-lg p-3 mt-3" th:text="${ev.comentarios}">
            Comentarios
          </p>
        </div>
        <p th:if="${#lists.isEmpty(evaluaciones)}" class="text-center text-sm text-slate-400 py-10">Aún no has recibido evaluaciones de empresas.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
