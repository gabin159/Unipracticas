<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Empresas aliadas · Tutor · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body>
<div class="tutor-layout">

  <div th:with="tutorIdParam=${param.tutorId}">
    <div th:replace="~{fragments/tutor-sidebar :: sidebar(activePage='empresas', tutorId=${tutorIdParam})}"></div>
  </div>

  <div class="tutor-content">
    <div class="p-7">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold font-display text-slate-900">Empresas aliadas</h1>
          <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(empresas)} + ' empresas registradas'">0</p>
        </div>
        <a th:href="@{/tutor/empresas/nueva}" class="bg-violet-700 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-violet-800">
          + Registrar empresa
        </a>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Empresa</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Sector</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Contacto</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Estudiantes</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${empresas}" class="border-b border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-3 text-sm font-medium text-slate-900" th:text="${e.nombreEmpresa}">Empresa</td>
              <td class="px-4 py-3 text-xs text-slate-600" th:text="${e.sector}">Sector</td>
              <td class="px-4 py-3 text-xs text-slate-600" th:text="${e.nombreContacto}">Contacto</td>
              <td class="px-4 py-3 text-sm font-bold text-emerald-600" th:text="${#lists.size(e.estudiantes)}">0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(empresas)}">
              <td colspan="4" class="text-center text-sm text-slate-400 py-8">No hay empresas registradas todavía.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
