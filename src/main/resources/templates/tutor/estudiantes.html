<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis estudiantes · Tutor · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body>
<div class="tutor-layout">

  <div th:replace="~{fragments/tutor-sidebar :: sidebar(activePage='estudiantes', tutorId=${tutorId})}"></div>

  <div class="tutor-content">
    <div class="p-7">
      <div class="mb-6">
        <h1 class="text-2xl font-bold font-display text-slate-900">Mis estudiantes</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(estudiantes)} + ' estudiantes asignados'">0</p>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Estudiante</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Programa</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Sem.</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Práctica / Empresa</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${estudiantes}" class="border-b border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-3">
                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0"
                       th:text="${#strings.substring(e.nombreCompleto,0,1)}">M</div>
                  <span class="text-sm font-medium text-slate-900" th:text="${e.nombreCompleto}">Nombre</span>
                </div>
              </td>
              <td class="px-4 py-3 text-xs text-slate-600" th:text="${e.programaAcademico}">Programa</td>
              <td class="px-4 py-3 text-sm text-slate-600" th:text="${e.semestre}">9</td>
              <td class="px-4 py-3">
                <span th:if="${e.practica != null}" th:text="${e.practica.titulo} + ' · ' + ${e.empresa.nombreEmpresa}" class="text-xs text-slate-700">Práctica</span>
                <span th:if="${e.practica == null}" class="text-xs text-slate-400">Sin práctica</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(estudiantes)}">
              <td colspan="4" class="text-center text-sm text-slate-400 py-8">No tienes estudiantes asignados todavía.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
