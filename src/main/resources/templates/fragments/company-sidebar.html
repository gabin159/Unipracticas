<!--
  fragments/company-sidebar.html
  ================================================================
  Traducción del componente <Sidebar /> de CompanyScreens.tsx.

  En React, el sidebar recibía `active` (para resaltar el botón)
  y `onNavigate` (para cambiar de pantalla sin recargar).

  Aquí, como cada pantalla es un .html distinto, hacemos lo mismo
  con dos cosas:
    1. Cada <a> apunta a la URL real de la página (th:href).
    2. Usamos th:classappend para poner is-active en el link que
       coincide con la página actual. Esa página actual se le pasa
       a este fragmento como parámetro `activePage` al insertarlo.

  Cómo se inserta en cada página (ver login.html, dashboard.html...):

    <div th:replace="~{fragments/company-sidebar :: sidebar(activePage='dashboard')}"></div>
-->
<div th:fragment="sidebar(activePage)"
     class="w-52 bg-slate-900 text-white flex flex-col flex-shrink-0 min-h-screen">

  <!-- Encabezado: logo + nombre de la empresa -->
  <div class="p-4 border-b border-slate-700">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md bg-yellow-500 flex items-center justify-center">
        <span class="text-white text-xs font-bold" th:text="${empresa != null ? empresa.iniciales : 'BC'}">BC</span>
      </div>
      <div>
        <p class="font-semibold text-sm font-display"
           th:text="${empresa != null ? empresa.nombre : 'Bancolombia'}">Bancolombia</p>
        <p class="text-xs text-slate-400">Empresa aliada</p>
      </div>
    </div>
  </div>

  <!-- Menú de navegación -->
  <nav class="flex-1 p-2 space-y-0.5">

    <a th:href="@{/company/dashboard}"
       th:classappend="${activePage == 'dashboard'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">⊞</span>
      <span>Panel principal</span>
    </a>

    <a th:href="@{/company/perfil}"
       th:classappend="${activePage == 'perfil'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">🏢</span>
      <span>Perfil de empresa</span>
    </a>

    <a th:href="@{/company/crear-practica}"
       th:classappend="${activePage == 'crear-practica'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">➕</span>
      <span>Publicar práctica</span>
    </a>

    <a th:href="@{/company/practicas}"
       th:classappend="${activePage == 'practicas'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">📋</span>
      <span>Mis prácticas</span>
    </a>

    <a th:href="@{/company/postulantes}"
       th:classappend="${activePage == 'postulantes'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">👥</span>
      <span>Postulantes y gestión</span>
    </a>

    <a th:href="@{/company/evaluacion}"
       th:classappend="${activePage == 'evaluacion'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">⭐</span>
      <span>Evaluación</span>
    </a>

  </nav>

  <!-- Información del usuario logueado -->
  <div class="p-3 border-t border-slate-700">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-yellow-500 flex items-center justify-center text-xs font-bold text-white">AG</div>
      <div class="min-w-0">
        <p class="text-xs font-medium truncate">Ana Sofía Giraldo</p>
        <p class="text-xs text-slate-400">Coordinadora</p>
      </div>
    </div>
  </div>

</div>
