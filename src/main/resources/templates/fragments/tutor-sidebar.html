<!--
  fragments/tutor-sidebar.html
  <div th:replace="~{fragments/tutor-sidebar :: sidebar(activePage='perfil', tutorId=${tutor.id})}"></div>
-->
<div th:fragment="sidebar(activePage, tutorId)"
     class="w-52 bg-slate-900 text-white flex flex-col flex-shrink-0 min-h-screen">

  <div class="p-4 border-b border-slate-700">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md bg-violet-600 flex items-center justify-center">
        <span class="text-white text-xs font-bold">UP</span>
      </div>
      <div>
        <p class="font-semibold text-sm font-display">UniPrácticas</p>
        <p class="text-xs text-slate-400">Portal del Tutor</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 p-2 space-y-0.5">

    <a th:href="@{/tutor/perfil/{id}(id=${tutorId})}"
       th:classappend="${activePage == 'perfil'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">⊞</span><span>Mi panel / perfil</span>
    </a>

    <a th:href="@{/tutor/estudiantes/{id}(id=${tutorId})}"
       th:classappend="${activePage == 'estudiantes'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">👥</span><span>Mis estudiantes</span>
    </a>

    <a th:href="@{/tutor/practicas(tutorId=${tutorId})}"
       th:classappend="${activePage == 'practicas'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">📊</span><span>Prácticas</span>
    </a>

    <a th:href="@{/tutor/evaluaciones/{id}(id=${tutorId})}"
       th:classappend="${activePage == 'evaluaciones'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">⭐</span><span>Evaluaciones</span>
    </a>

    <a th:href="@{/tutor/empresas(tutorId=${tutorId})}"
       th:classappend="${activePage == 'empresas'} ? 'is-active' : ''"
       class="sidebar-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
      <span class="text-base">🏢</span><span>Empresas aliadas</span>
    </a>

  </nav>
<div class="p-3 border-t border-slate-700">
<a th:href="@{/}"
   onclick="return confirm('¿Estás seguro de que deseas cerrar la sesión?');"
   class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:bg-red-500/10 hover:text-red-400">
  <span class="text-base">🚪</span>
  <span>Cerrar sesión</span>
</a>
</div>
  <div class="p-3 border-t border-slate-700">
    <p class="text-xs text-slate-400">Sesión de tutor</p>
  </div>

</div>
