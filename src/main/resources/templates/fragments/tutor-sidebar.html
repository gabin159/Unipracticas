<div th:fragment="sidebar(activePage, tutorId)"
     class="w-56 bg-slate-900 text-white flex flex-col flex-shrink-0 h-screen sticky top-0 border-r border-slate-800">

  <!-- Header Sidebar -->
  <div class="p-4 border-b border-slate-800 flex-shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-violet-600 flex items-center justify-center font-bold text-white text-xs shadow-sm">
        UP
      </div>
      <div class="min-w-0">
        <p class="font-bold text-sm font-display text-white tracking-wide truncate">UniPrácticas</p>
        <p class="text-[11px] text-slate-400 truncate">Portal del Tutor</p>
      </div>
    </div>
  </div>

  <!-- Navegación con enlaces protegidos contra IDs nulos -->
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">

    <a th:href="@{/tutor/perfil/{id}(id=${tutorId != null ? tutorId : 1})}"
       th:classappend="${activePage == 'perfil'} ? 'bg-violet-600 text-white font-semibold' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'"
       class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all">
      <span class="text-sm">⊞</span><span>Mi panel / perfil</span>
    </a>

    <a th:href="@{/tutor/estudiantes/{id}(id=${tutorId != null ? tutorId : 1})}"
       th:classappend="${activePage == 'estudiantes'} ? 'bg-violet-600 text-white font-semibold' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'"
       class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all">
      <span class="text-sm">👥</span><span>Mis estudiantes</span>
    </a>

    <a th:href="@{/tutor/practicas(tutorId=${tutorId != null ? tutorId : 1})}"
       th:classappend="${activePage == 'practicas'} ? 'bg-violet-600 text-white font-semibold' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'"
       class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all">
      <span class="text-sm">📊</span><span>Prácticas</span>
    </a>

    <a th:href="@{/tutor/evaluaciones/{id}(id=${tutorId != null ? tutorId : 1})}"
       th:classappend="${activePage == 'evaluaciones'} ? 'bg-violet-600 text-white font-semibold' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'"
       class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all">
      <span class="text-sm">⭐</span><span>Evaluaciones</span>
    </a>

    <a th:href="@{/tutor/empresas(tutorId=${tutorId != null ? tutorId : 1})}"
       th:classappend="${activePage == 'empresas'} ? 'bg-violet-600 text-white font-semibold' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'"
       class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all">
      <span class="text-sm">🏢</span><span>Empresas aliadas</span>
    </a>

  </nav>

  <!-- Footer Unificado -->
  <div class="p-3 border-t border-slate-800 bg-slate-900/50 flex-shrink-0 space-y-2">
    <a th:href="@{/}"
       onclick="return confirm('¿Estás seguro de que deseas cerrar la sesión?');"
       class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all text-slate-300 hover:bg-red-500/10 hover:text-red-400 border border-transparent hover:border-red-500/20">
      <span class="text-sm">🚪</span>
      <span>Cerrar sesión</span>
    </a>

    <div class="px-3 pt-1 flex items-center justify-between text-[10px] text-slate-500">
      <span>Sesión de tutor</span>
      <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>
    </div>
  </div>

</div>
