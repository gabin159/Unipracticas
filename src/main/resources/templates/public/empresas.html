<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prácticas Disponibles - UniPrácticas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

  <div id="header-container"></div>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div class="mb-6">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-700 font-medium mb-3 transition-colors">
        ← Volver al inicio
      </a>
      <h1 class="text-2xl font-bold text-slate-900">Prácticas disponibles</h1>
      <p id="results-counter" class="text-slate-500 text-sm mt-1">Cargando resultados...</p>
    </div>

    <!-- Filtros -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-6 flex flex-col md:flex-row items-center gap-4">
      <div class="flex-1 w-full">
        <input id="input-search" type="text" placeholder="Buscar por nombre, empresa o área..." class="w-full text-sm border border-slate-200 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <span class="text-xs text-slate-500 font-medium">Área:</span>
        <select id="select-area" class="text-sm border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 w-full">
          <option value="Todas">Todas</option>
        </select>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <span class="text-xs text-slate-500 font-medium">Modalidad:</span>
        <select id="select-modalidad" class="text-sm border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 w-full">
          <option value="Todas">Todas</option>
          <option value="Presencial">Presencial</option>
          <option value="Híbrida">Híbrida</option>
          <option value="Remota">Remota</option>
        </select>
      </div>
    </div>

    <!-- Grilla de Tarjetas -->
    <div id="practices-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Se inyecta dinámicamente con JS -->
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadFragment('../fragments/header.html', 'header-container');
      initPracticesList();
    });
  </script>
</body>
</html>
