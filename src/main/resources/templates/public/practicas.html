<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Prácticas disponibles · UniPrácticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body class="bg-white text-slate-900">

  <div class="max-w-6xl mx-auto px-6 py-10">

    <!-- Cabecera -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Prácticas disponibles</h1>
        <p class="text-slate-500 text-sm mt-1" th:text="${#lists.size(practicas)} + ' resultados'">0 resultados</p>
      </div>
      <a th:href="@{/}" class="text-blue-700 text-sm font-medium hover:underline">← Volver al inicio</a>
    </div>

    <!-- Buscador -->
    <form th:action="@{/practicas}" method="get" class="bg-white border border-slate-200 rounded-xl p-4 mb-6 flex flex-col md:flex-row items-center gap-3 shadow-sm">
      <input name="buscar" th:value="${buscar}" placeholder="Buscar por título, empresa o área..."
             class="w-full md:flex-1 text-sm border border-slate-200 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit" class="w-full md:w-auto text-sm font-semibold text-white bg-blue-700 px-6 py-2 rounded-lg hover:bg-blue-800 transition-colors">
        Buscar
      </button>
    </form>

    <!-- Grilla de Tarjetas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a th:each="p : ${practicas}" 
         th:href="@{'/practicas/' + ${p.id}}" 
         class="group bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md hover:border-blue-300 transition-all flex flex-col justify-between">
        
        <div>
          <!-- Cabecera de Tarjeta -->
          <div class="flex items-start gap-3 mb-3">
            <span class="w-10 h-10 rounded-xl bg-amber-500 text-white font-bold text-xs flex items-center justify-center uppercase shrink-0 shadow-sm"
                  th:text="${#strings.substring(p.empresa.nombreEmpresa, 0, 2)}">
              BC
            </span>
            <div class="min-w-0">
              <h3 class="font-bold text-slate-900 text-sm leading-snug group-hover:text-blue-700 transition-colors line-clamp-2" th:text="${p.titulo}">
                Título
              </h3>
              <p class="text-slate-400 text-xs mt-0.5 truncate" th:text="${p.empresa.nombreEmpresa}">
                Empresa
              </p>
            </div>
          </div>

          <!-- Badges Informativos -->
          <div class="flex flex-wrap gap-1.5 mb-4">
            <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border bg-blue-50 text-blue-600 border-blue-200" th:text="${p.area}">
              Área
            </span>
            <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border bg-slate-100 text-slate-600 border-slate-200" th:text="${p.modalidad}">
              Modalidad
            </span>
            <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border bg-slate-100 text-slate-600 border-slate-200" th:text="${p.duracion != null ? p.duracion : '6 meses'}">
              6 meses
            </span>
          </div>
        </div>

        <!-- Ubicación y Vacantes -->
        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
          <div class="flex items-center gap-1 min-w-0">
            <span class="text-red-500"></span>
            <span class="truncate" th:text="${p.ciudadUbicacion != null ? p.ciudadUbicacion : 'Tunja'}">Ciudad</span>
          </div>
          <span class="font-semibold text-slate-700 whitespace-nowrap" th:text="${p.vacantes} + ' vacantes'">
            1 vacante
          </span>
        </div>

      </a>

      <!-- Mensaje cuando no hay datos -->
      <p th:if="${#lists.isEmpty(practicas)}" class="col-span-3 text-center text-sm text-slate-400 py-10">
        No hay prácticas disponibles que coincidan con tu búsqueda.
      </p>
    </div>

  </div>

</body>
</html>
