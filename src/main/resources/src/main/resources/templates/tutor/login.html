<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>UniPrácticas · Tutores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/tutor.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 to-slate-100 flex items-center justify-center p-8">

<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <div class="w-12 h-12 rounded-xl bg-violet-700 flex items-center justify-center mx-auto mb-3">
      <span class="text-white font-bold text-lg">UP</span>
    </div>
    <h1 class="text-2xl font-bold font-display text-slate-900">UniPrácticas</h1>
    <p class="text-slate-500 text-sm">Portal de Tutores · UST</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">

    <div class="flex rounded-xl border border-slate-200 p-1 mb-6">
      <button type="button" id="tabLogin"
              th:classappend="${modo} == 'register' ? '' : 'is-active'"
              class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-lg transition-colors text-slate-500 hover:text-slate-700">
        Iniciar sesión
      </button>
      <button type="button" id="tabRegister"
              th:classappend="${modo} == 'register' ? 'is-active' : ''"
              class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-lg transition-colors text-slate-500 hover:text-slate-700">
        Crear cuenta
      </button>
    </div>

    <!-- LOGIN -->
    <form id="formLogin" th:action="@{/tutor/login}" method="post"
          th:classappend="${modo} == 'register' ? 'hidden' : ''" class="space-y-4">
      <div>
        <label for="correoLogin" class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional</label>
        <input id="correoLogin" name="correo" type="email" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500"
               placeholder="profe.nombre@usantoto.edu.co">
      </div>
      <div>
        <label for="passwordLogin" class="text-xs font-medium text-slate-700 mb-1 block">Contraseña</label>
        <input id="passwordLogin" name="password" type="password" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500" placeholder="••••••••">
      </div>
      <p th:if="${param.error}" class="text-red-600 text-xs text-center">Correo o contraseña incorrectos.</p>
      <button type="submit" class="w-full mt-1 bg-violet-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-violet-800 transition-colors">
        Iniciar sesión
      </button>
      <p class="text-center text-xs text-slate-500">
        ¿No tienes cuenta? <span id="irARegistro" class="text-violet-700 font-medium cursor-pointer hover:underline">Regístrate aquí</span>
      </p>
    </form>

    <!-- REGISTRO -->
    <form id="formRegister" th:action="@{/tutor/register}" method="post"
          th:classappend="${modo} == 'register' ? '' : 'hidden'" class="space-y-3">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="nombre" class="text-xs font-medium text-slate-700 mb-1 block">Nombre *</label>
          <input id="nombre" name="nombre" required placeholder="Ej: Javier"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <div>
          <label for="apellido" class="text-xs font-medium text-slate-700 mb-1 block">Apellido *</label>
          <input id="apellido" name="apellido" required placeholder="Ej: Hernández"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
        </div>
      </div>

      <div>
        <label for="facultad" class="text-xs font-medium text-slate-700 mb-1 block">Facultad *</label>
        <select id="facultad" name="facultad" required
                class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
          <option value="">Seleccionar facultad...</option>
          <option>Facultad de Ingeniería</option>
          <option>Facultad de Ciencias Económicas y Administrativas</option>
          <option>Facultad de Ciencias de la Salud</option>
          <option>Facultad de Ciencias Humanas y Sociales</option>
          <option>Facultad de Educación</option>
          <option>Facultad de Ciencias Exactas y Naturales</option>
        </select>
      </div>

      <div>
        <label for="departamento" class="text-xs font-medium text-slate-700 mb-1 block">Departamento *</label>
        <input id="departamento" name="departamento" required placeholder="Ej: Dpto. de Ingeniería de Sistemas"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <div>
        <label for="correoRegistro" class="text-xs font-medium text-slate-700 mb-1 block">Correo institucional *</label>
        <input id="correoRegistro" name="correo" type="email" required placeholder="profe.nombre@usantoto.edu.co"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
      </div>

      <div>
        <label for="passwordRegistro" class="text-xs font-medium text-slate-700 mb-1 block">Contraseña *</label>
        <input id="passwordRegistro" name="password" type="password" required minlength="8" placeholder="Mínimo 8 caracteres"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
      </div>
      <div>
        <label for="passwordConfirmacion" class="text-xs font-medium text-slate-700 mb-1 block">Confirmar contraseña *</label>
        <input id="passwordConfirmacion" name="passwordConfirmacion" type="password" required minlength="8" placeholder="Repite tu contraseña"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500">
      </div>
      <p id="errorConfirmacion" class="hidden text-red-600 text-xs text-center">Las contraseñas no coinciden.</p>

      <button type="submit" class="w-full mt-1 bg-violet-700 text-white font-semibold text-sm py-2.5 rounded-lg hover:bg-violet-800 transition-colors">
        Crear cuenta de tutor
      </button>
      <p class="text-center text-xs text-slate-500">
        ¿Ya tienes cuenta? <span id="irALogin" class="text-violet-700 font-medium cursor-pointer hover:underline">Inicia sesión</span>
      </p>
    </form>

  </div>
</div>

<script th:src="@{/js/tutor.js}"></script>
</body>
</html>
